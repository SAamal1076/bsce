# LVAMP (SVD parameterisation, Bernoulli-Gaussian denoiser) as LVAMP.py (Borgerding)
model: {model: LVAMP, T: 6, complex_mode: true, precision: float32}
train:
  schedule: borgerding
  lr: 1.0e-4
  refinements: [0.5, 0.1, 0.01]
  maxit: 1000000
  better_wait: 5000
  ivl: 10
  check_mult: 100
  batch_size: 1000
  loss: l2
  val_metric: nmse_l2
  val_round: null
  refine_name: value
  optimizer: adam_tf1
