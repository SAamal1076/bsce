# Graph-LADMM (v31): the graph-reweighted l1 z-step in gladmm's layer (whitened data step + magnetic graph TV), i.e.
# gladmm with the reweighting instead of the energy gate. 51 parameters at T = 8. SV UPA (18 Oct, 4,500 steps): 0.48 dB
# behind gladmm. Its own end-to-end training: run_suite.py --protocol paper.
model: {model: Graph-LADMM, T: 8, zstep: gtv_rwl1, xstep: analytic, sigma: residual, edge_phase: data, lr_mult: 10.0,
        precision: float32}
train:
  schedule: steps
  steps: 30000
  lr: 1.0e-3
  lr_final_frac: 0.05
  grad_clip: 1.0
  batch_size: 256
  loss: log_nse
  val_metric: nmse
  val_round: null
  val_every: 500
  restore_best: true
  optimizer: adam_torch
  noise: online
