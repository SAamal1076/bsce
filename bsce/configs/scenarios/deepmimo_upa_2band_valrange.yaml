# DeepMIMO UPA (GM-LAMP data), bands 0-10 / 10-20 dB validated over the WHOLE band (validation files do not exist ->
# finetune_bands.py generates fixed validation noise SNR ~ U(band), seed 123). Used to fine-tune a 0-20 dB network per band.
_base: deepmimo_upa.yaml
name: DeepMIMO_UPA
bands:
  - {name: 0to10dB,  train: [0, 10],  val_range: [0, 10],  val_name: 0to10dB_valrange,  use_for: [0, 10]}
  - {name: 10to20dB, train: [10, 20], val_range: [10, 20], val_name: 10to20dB_valrange, use_for: [10, 20.01]}
