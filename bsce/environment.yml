# conda environment for bsce (Windows, Linux, macOS)
#   conda env create -f environment.yml
#   conda activate bsce
#   then install PyTorch with CUDA (README section 1), e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
name: bsce
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=1.24
      - scipy>=1.10
      - pyyaml>=6
      - matplotlib>=3.7
      - markdown>=3.4
      - pytest>=7
